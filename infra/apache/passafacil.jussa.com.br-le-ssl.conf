<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName passafacil.jussa.com.br

    # Desafio ACME (renovacoes) via webroot, fora do proxy
    Alias /.well-known/acme-challenge/ /var/www/html/passafacil-acme/.well-known/acme-challenge/
    <Directory /var/www/html/passafacil-acme/.well-known/acme-challenge/>
        Require all granted
    </Directory>
    ProxyPass /.well-known/acme-challenge/ !

    ProxyPreserveHost On
    ProxyRequests Off

    # API FastAPI (prefixo /api/v1) + utilidades
    ProxyPass        /api/         http://127.0.0.1:9000/api/
    ProxyPassReverse /api/         http://127.0.0.1:9000/api/
    ProxyPass        /health       http://127.0.0.1:9000/health
    ProxyPassReverse /health       http://127.0.0.1:9000/health
    ProxyPass        /docs         http://127.0.0.1:9000/docs
    ProxyPassReverse /docs         http://127.0.0.1:9000/docs
    ProxyPass        /openapi.json http://127.0.0.1:9000/openapi.json
    ProxyPassReverse /openapi.json http://127.0.0.1:9000/openapi.json

    # Frontend Next.js (match generico, por ultimo)
    ProxyPass        /             http://127.0.0.1:9001/
    ProxyPassReverse /             http://127.0.0.1:9001/

    # Apache local fala https com o proxy -> uvicorn confia no X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto "https"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    # Nunca cachear HTML (casca do app); assets com hash continuam cacheaveis
    <IfModule mod_headers.c>
        Header set Cache-Control "no-cache, must-revalidate" "expr=%{CONTENT_TYPE} =~ m#text/html#"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/passafacil_error.log
    CustomLog ${APACHE_LOG_DIR}/passafacil_access.log combined

    SSLCertificateFile /etc/letsencrypt/live/passafacil.jussa.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/passafacil.jussa.com.br/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
