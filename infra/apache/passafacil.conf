<VirtualHost *:80>
    ServerName passafacil.jussa.com.br
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName passafacil.jussa.com.br

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/passafacil.jussa.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/passafacil.jussa.com.br/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass        /api/ http://127.0.0.1:9000/api/
    ProxyPassReverse /api/ http://127.0.0.1:9000/api/

    ProxyPass        /health http://127.0.0.1:9000/health
    ProxyPassReverse /health http://127.0.0.1:9000/health

    ProxyPass        / http://127.0.0.1:9001/
    ProxyPassReverse / http://127.0.0.1:9001/

    RequestHeader set X-Forwarded-Proto "https"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog ${APACHE_LOG_DIR}/passafacil-error.log
    CustomLog ${APACHE_LOG_DIR}/passafacil-access.log combined
</VirtualHost>
