<VirtualHost *:80>
    ServerName passafacil.jussa.com.br

    # Desafio ACME (Let's Encrypt) via webroot
    Alias /.well-known/acme-challenge/ /var/www/html/passafacil-acme/.well-known/acme-challenge/
    <Directory /var/www/html/passafacil-acme/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    # Todo o resto vai para HTTPS
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/passafacil_error.log
    CustomLog ${APACHE_LOG_DIR}/passafacil_access.log combined
</VirtualHost>
