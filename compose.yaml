services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-passafacil}
      POSTGRES_USER: ${POSTGRES_USER:-passafacil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-passafacil}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://passafacil:change-me-in-production@db:5432/passafacil}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:9001}
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:9000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:9000/api/v1}
      PORT: 9001
    ports:
      - "9001:9001"
    depends_on:
      - api

volumes:
  postgres_data:
